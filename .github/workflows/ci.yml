name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @chromeclaw/browser exec playwright install --with-deps chromium
      - run: pnpm eval
      - run: pnpm eval:credentials
      - run: pnpm eval:safety
      - run: pnpm eval:runtime
      - run: pnpm eval:configuration
      - run: pnpm eval:models
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-evidence
          path: |
            .chromeclaw/eval
            .chromeclaw/credential-safety
            .chromeclaw/phase2-safety
            .chromeclaw/phase3-runtime
            .chromeclaw/phase4-configuration
            .chromeclaw/phase4-models
          include-hidden-files: true
          if-no-files-found: error

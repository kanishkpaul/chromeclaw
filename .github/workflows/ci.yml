name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @chromeclaw/browser exec playwright install --with-deps chromium
      - run: pnpm eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-evidence
          path: .chromeclaw/eval
          include-hidden-files: true
          if-no-files-found: error

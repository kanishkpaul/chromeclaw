name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @chromeclaw/browser exec playwright install --with-deps chromium
      - run: pnpm eval
      - run: pnpm eval:credentials
      - run: pnpm eval:safety
      - run: pnpm eval:runtime
      - run: pnpm eval:configuration
      - run: pnpm eval:models
      - run: pnpm eval:ask
      - run: pnpm exec tsx --tsconfig tsconfig.base.json packages/agent/tests/ask.browser.mjs --built
      - run: pnpm eval:find
      - run: pnpm exec tsx --tsconfig tsconfig.base.json packages/agent/tests/find.browser.mjs --built
      - run: pnpm eval:find-labelled
      - run: pnpm exec tsx --tsconfig tsconfig.base.json packages/agent/tests/find-model.browser.mjs --built
      - run: pnpm eval:work-safety
      - run: pnpm exec tsx --tsconfig tsconfig.base.json packages/browser/tests/work.browser.mjs --built
      - run: pnpm eval:work
      - run: pnpm eval:session
      - run: pnpm eval:readers
      - run: pnpm eval:tui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-evidence
          path: |
            .chromeclaw/eval
            .chromeclaw/credential-safety
            .chromeclaw/phase2-safety
            .chromeclaw/phase3-runtime
            .chromeclaw/phase4-configuration
            .chromeclaw/phase4-models
            .chromeclaw/phase5-terminal
            .chromeclaw/phase5-ask
            .chromeclaw/phase5-session
            .chromeclaw/phase6-find-labelled
            .chromeclaw/phase6-work
            .chromeclaw/phase6-work-safety
            .chromeclaw/phase6-find
            .chromeclaw/phase7-readers
          include-hidden-files: true
          if-no-files-found: error
